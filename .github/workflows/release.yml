# Builds the installer when a version tag (e.g. v0.1.0) is pushed, and attaches it
# to a draft GitHub release. Check the draft, then publish it yourself.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match version $version in tauri.conf.json"
            exit 1
          }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p bulk-core -p bulk-cli

      # Builds the helper, CLI and app, then the NSIS installer.
      - name: Build installer
        run: pnpm bundle

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $notes = "SHA256 of ``$($installer.Name)``: ``$hash``"
          gh release create "${{ github.ref_name }}" $installer.FullName `
            --draft --title "Bulk ${{ github.ref_name }}" --generate-notes --notes $notes
