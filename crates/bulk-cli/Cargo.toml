[package]
name = "bulk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Installed as `bin\bulk.exe`. Built as `bulk-cli.exe` so it doesn't overwrite the
# app's `bulk.exe` in `target`.
[[bin]]
name = "bulk-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bulk-core.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help"] }
ratatui = "0.30"
serde.workspace = true
serde_json.workspace = true

[dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"]

[lints]
workspace = true
