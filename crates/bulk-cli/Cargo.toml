[package]
name = "bulk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Installed as `bin\bulk.exe`. Built as `bulk-cli.exe` so it doesn't overwrite the
# app's `bulk.exe` in `target`.
[[bin]]
name = "bulk-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bulk-core.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossterm = "0.29"
ratatui = "0.30"
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
