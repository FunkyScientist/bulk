[workspace]
resolver = "3"
members = ["crates/bulk-core", "crates/bulk-helper", "crates/bulk-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# Descending sorts read more clearly as `b.cmp(&a)` than with `Reverse`.
unnecessary_sort_by = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
bulk-core = { path = "crates/bulk-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# The scanner is far too slow unoptimized, even while developing the UI.
# Incremental builds of it at opt-level 3 sometimes leave stale symbols that fail
# to link ("unresolved external symbol anon.…llvm…"), so build it whole.
[profile.dev.package.bulk-core]
opt-level = 3
incremental = false
