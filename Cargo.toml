[workspace]
resolver = "3"
members = ["crates/bulk-core", "crates/bulk-helper", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bulk-core = { path = "crates/bulk-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# The scanner is far too slow unoptimized, even while developing the UI.
[profile.dev.package.bulk-core]
opt-level = 3
